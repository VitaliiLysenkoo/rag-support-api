
services:
  db:
    # Use the official Postgres image with the pgvector extension pre-installed
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: rag_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Replace localhost with the container name (db)
      - DATABASE_URL=postgresql://rag_user:rag_password@db:5432/rag_db
      # OpenAI key is passed from the local .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
    volumes:
      # Mount the documents folder into the container
      - ./test_documents:/app/test_documents

volumes:
  postgres_data:
